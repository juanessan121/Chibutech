server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php;

    # ── Charset y logs ──────────────────────────────────────────────────────
    charset utf-8;
    access_log /var/log/nginx/chibutech_access.log;
    error_log  /var/log/nginx/chibutech_error.log;

    # ── API → PHP-FPM (backend) ──────────────────────────────────────────────
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Swagger UI ───────────────────────────────────────────────────────────
    location /api/documentation {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM ──────────────────────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass   chibutech_backend:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # ── Frontend (Vite dev server) ────────────────────────────────────────────
    # Descomenta cuando el frontend esté corriendo
    # location / {
    #     proxy_pass http://chibutech_frontend:5173;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header Host $host;
    # }

    # ── Assets estáticos ─────────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Seguridad básica ─────────────────────────────────────────────────────
    location ~ /\.(?!well-known).* {
        deny all;
    }

    client_max_body_size 20M;
}
