services:

  db:
    image: mariadb:10.11
    container_name: chibutech_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${DB_DATABASE}
      MYSQL_USER:          ${DB_USERNAME}
      MYSQL_PASSWORD:      ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_EXTERNAL_PORT:-3306}:3306"
    networks:
      - chibutech_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chibutech_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME:    ${APP_NAME:-Chibutech}
      APP_ENV:     ${APP_ENV:-local}
      APP_KEY:     ${APP_KEY}
      APP_DEBUG:   ${APP_DEBUG:-true}
      APP_URL:     ${APP_URL:-http://localhost}
      DB_CONNECTION: mysql
      DB_HOST:       db
      DB_PORT:       3306
      DB_DATABASE:   ${DB_DATABASE}
      DB_USERNAME:   ${DB_USERNAME}
      DB_PASSWORD:   ${DB_PASSWORD}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost,127.0.0.1,localhost:5173}
      L5_SWAGGER_GENERATE_ALWAYS: ${L5_SWAGGER_GENERATE_ALWAYS:-true}
      L5_SWAGGER_CONST_HOST:      ${APP_URL:-http://localhost}
      CACHE_DRIVER:     file
      SESSION_DRIVER:   file
      QUEUE_CONNECTION: sync
      LOG_CHANNEL:      stack
      LOG_LEVEL:        ${LOG_LEVEL:-debug}
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_storage:/var/www/html/storage
    networks:
      - chibutech_net

  nginx:
    image: nginx:1.25-alpine
    container_name: chibutech_nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/html/public:ro
    networks:
      - chibutech_net

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: chibutech_phpmyadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST:     db
      PMA_PORT:     3306
      PMA_USER:     root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD}
      UPLOAD_LIMIT: 100M
    ports:
      - "${PMA_PORT:-8080}:80"
    networks:
      - chibutech_net

  mailpit:
    image: axllent/mailpit:latest
    container_name: chibutech_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - chibutech_net

  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: chibutech_frontend
  #   restart: unless-stopped
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules
  #   ports:
  #     - "5173:5173"
  #   networks:
  #     - chibutech_net

volumes:
  db_data:
    driver: local
  backend_vendor:
    driver: local
  backend_storage:
    driver: local

networks:
  chibutech_net:
    driver: bridge
