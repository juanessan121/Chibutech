version: '3.8'

services:
  db:
    image: mariadb:10.6.25-jammy
    container_name: chibutech_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_super_secreto
      MYSQL_DATABASE: chibutech_dev
      MYSQL_USER: chibu_user
      MYSQL_PASSWORD: chibu_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chibutech_backend
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - db

volumes:
  db_data:
